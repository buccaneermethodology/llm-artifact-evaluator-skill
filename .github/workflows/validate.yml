name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tests/run_tests.py
      - run: python3 scripts/evaluate_artifacts.py --case examples/minimal-evaluation --candidate candidates/candidate-pass.json
      - run: python3 -m py_compile scripts/*.py tests/*.py .codex/skills/llm-artifact-evaluator/scripts/*.py
      - run: python3 scripts/validate_skill_layout.py .codex/skills/llm-artifact-evaluator
